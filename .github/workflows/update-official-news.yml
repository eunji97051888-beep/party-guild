name: Update official game notices
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-news-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Collect official announcements
        id: collect
        run: python scripts/collect_official_news.py
      - name: Upload collection diagnostics
        if: failure() && steps.collect.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: official-news-debug
          path: official-news-debug/
          if-no-files-found: warn
          retention-days: 7
      - name: Commit updated notices only
        run: |
          if git diff --quiet -- official-news.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add official-news.json
          git commit -m 'Update official game notices'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "The remote changed during push. Retrying ($attempt/3)..."
            sleep 3
          done
          exit 1
