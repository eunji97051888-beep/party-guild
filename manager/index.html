<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>파티 문주</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#2b2249"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color-scheme:dark;background:#121a33;color:#fff5db}*{box-sizing:border-box}body{margin:0;background:#121a33}header{padding:12px 14px;background:linear-gradient(100deg,#251d41,#403259);border-bottom:1px solid #b68c54;display:flex;align-items:center;gap:10px}header img{width:46px;height:46px;border-radius:12px}header strong{font-size:18px;color:#f7dc9c}header small{display:block;font-size:11px;color:#c7b9e4}header .grow{flex:1}button,a{font:inherit}button{cursor:pointer}.install{border:1px solid #edc376;border-radius:9px;padding:9px 10px;background:#d8ad60;color:#291b3b;font-weight:800}.guide{display:none;position:fixed;z-index:10;left:12px;right:12px;top:76px;background:#35284d;border:1px solid #e3bf84;border-radius:14px;padding:16px;box-shadow:0 10px 30px #0009}.guide.show{display:block}.guide button{float:right;color:#fff;background:#604775;border:0;border-radius:8px;padding:6px 9px}.notice{font-size:12px;padding:8px 12px;color:#e0cda8;background:#25223a;line-height:1.6}.nav{display:flex;gap:6px;overflow-x:auto;padding:9px 10px;background:#181c32;scrollbar-width:thin}.nav button{flex:0 0 auto;background:#312843;color:#e4dbf2;border:1px solid #756086;border-radius:10px;padding:10px 11px;font-size:13px;white-space:nowrap}.nav button.active{background:#deb76b;color:#211d2d;border-color:#ebd1a3;font-weight:800}.frame-wrap{height:calc(100dvh - 190px);min-height:420px}iframe{width:100%;height:100%;display:block;border:0;background:#101927}footer{background:#181c32;border-top:1px solid #5e4a63;padding:7px 12px;text-align:center;font-size:11px;color:#c8b9d1}.open{color:#f0d28e}
@media(max-width:460px){header{padding:8px 9px}header img{width:39px;height:39px}header strong{font-size:16px}.install{font-size:12px;padding:8px}.notice{font-size:11px}.frame-wrap{height:calc(100dvh - 175px)}.nav{padding:7px}.nav button{font-size:12px;padding:9px}}
</style></head><body>
<header><img src="./icon-192.png" alt="파티 문주 아이콘"><div class="grow"><strong>파티 문주</strong><small>문파 운영 전용 도구</small></div><button type="button" class="install" id="install">📱 앱 설치</button></header>
<div class="notice">⚠️ 문주 화면은 비밀번호로 보호되지 않아. GitHub 업로드 권한은 별개이며, 출석·보상 기록은 PC와 휴대폰이 자동 동기화되지 않아. 수정 전 원본 JSON 백업을 권장해.</div>
<nav class="nav" aria-label="문주 기능"><button type="button" data-page="admin.html" class="active">✏️ 문주 편집</button><button type="button" data-page="members.html">✅ 출석 관리</button><button type="button" data-page="rewards.html">🎁 보상 관리</button><button type="button" data-page="weekly-board-editor.html">📅 주간 달력</button><button type="button" data-page="activity-news-editor.html">📋 활동 소식</button><button type="button" data-page="index.html">🏠 홈페이지</button></nav>
<main class="frame-wrap"><iframe id="panel" title="문주 편집 화면" src="../admin.html" referrerpolicy="same-origin"></iframe></main>
<footer>수정 후 내보낸 .js/JSON 파일은 GitHub에 직접 업로드해야 반영돼. · <a class="open" href="https://github.com/eunji97051888-beep/party-guild" target="_blank" rel="noopener noreferrer">GitHub 열기 ↗</a></footer>
<div class="guide" id="guide" role="dialog" aria-label="설치 안내"><button type="button" id="close">닫기</button><p id="help"></p></div>
<script>
(()=>{'use strict';const frame=document.getElementById('panel');const nav=[...document.querySelectorAll('[data-page]')];nav.forEach(b=>b.addEventListener('click',()=>{nav.forEach(n=>n.classList.toggle('active',n===b));frame.src='../'+b.dataset.page;}));
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(e=>console.warn('Service Worker:',e));}
let deferred=null;const install=document.getElementById('install');const guide=document.getElementById('guide');const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if(standalone())install.hidden=true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;});
window.addEventListener('appinstalled',()=>{deferred=null;install.hidden=true;guide.classList.remove('show');});
document.getElementById('close').onclick=()=>guide.classList.remove('show');
install.onclick=async()=>{if(deferred){const e=deferred;deferred=null;try{await e.prompt();await e.userChoice;return;}catch(err){console.warn(err)}}const ua=navigator.userAgent.toLowerCase();document.getElementById('help').textContent=/iphone|ipad/.test(ua)?'Safari에서 공유 → 홈 화면에 추가를 선택해 주세요.':/android/.test(ua)?'Chrome 메뉴(⋮) → 홈 화면에 추가 / 앱 설치를 선택해 주세요. 카카오톡 내부 브라우저라면 Chrome에서 열어 주세요.':'브라우저 메뉴에서 앱 설치 또는 홈 화면에 추가를 선택해 주세요.';guide.classList.add('show');};
})();
</script></body></html>
