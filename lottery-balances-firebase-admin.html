<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파티 문파 · Firebase 킵 잔액 관리</title><link rel="stylesheet" href="lottery-results.css?v=3"></head><body><main class="wrap"><header><a href="admin.html">← 문주편집기</a><a href="lottery-results.html">행운의전당 ↗</a></header><h1>☁ 문파주화 킵 잔액 Firebase 게시</h1><p class="muted">기존 공개 장부 파일은 보존해. 게시 버튼을 누르기 전에는 Firebase에 아무것도 쓰지 않아. 새 추첨기의 <code>lottery-balances-data.js</code>나 JSON 파일을 올릴 수 있어.</p><section class="panel"><h2>문주 계정 및 공개 장부 확인</h2><button id="login">Google 관리자 로그인</button><button id="check">Firebase 기존 장부 확인</button><p id="status" class="muted" style="white-space:pre-line" aria-live="polite"></p></section><section class="panel"><h2>게시할 킵 잔액 선택</h2><label>킵 잔액 파일 (.json 또는 lottery-balances-data.js)<input type="file" id="file" accept=".json,.js,application/json,text/javascript"/></label><p id="preview" class="muted"></p><button id="publish" disabled>Firebase 공개 킵 잔액 게시</button><p class="muted">기존 기록을 덮어쓰거나 금액이 잘못되면 공개되는 잔액도 달라져. 게임 정산·지급 장부와 반드시 대조해 줘.</p></section></main><script src="lottery-balances-data.js?v=1"></script><script type="module" src="party-lottery-balances-admin.js?v=1"></script></body></html>
