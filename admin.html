<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>파티 문파 | 관리자</title><link rel="stylesheet" href="style.css"></head><body><header><nav><span class="logo">✦ PARTY · 관리자</span><div class="navlinks"><a href="index.html">← 문파원 화면</a></div></nav></header><main class="wrap"><div class="hero"><span class="eyebrow">PARTY CONTROL ROOM</span><h1>문파 일정 관리</h1><p class="muted">관리자 로그인 후 스크린샷과 요일별 일정을 변경할 수 있습니다.</p></div><section class="card" id="login"><h2>🔐 관리자 로그인</h2><label>이메일</label><input id="email" type="email" autocomplete="username" placeholder="Firebase에 등록한 관리자 이메일"><label>비밀번호</label><input id="pass" type="password" autocomplete="current-password"><p><button id="signIn" class="btn">로그인</button></p></section><section class="card" id="editor" hidden><div class="tools" style="justify-content:space-between"><h2>🛠️ 일정 편집</h2><span class="muted" id="user"></span><button class="btn alt" id="logout">로그아웃</button></div><h3>주간 플래너 스크린샷</h3><img src="weekly.png" alt="현재 주간 이미지" id="preview" class="shot" style="max-width:600px"><label>새 스크린샷 (업로드하지 않으면 현재 사진 유지)</label><input type="file" id="imageFile" accept="image/*"><h3 style="margin-top:28px">요일별 콘텐츠</h3><p class="muted">한 줄이 한 콘텐츠입니다. 반복 요일에 체크하세요. 이미지 속 '20:00 출현' 등의 시간을 직접 입력할 수 있습니다.</p><div id="rows"></div><p><button type="button" id="add" class="btn alt">+ 콘텐츠 추가</button></p><label>추가 안내 문구</label><textarea id="noteEdit" rows="3"></textarea><p class="tools"><button id="save" class="btn" type="button">☁ 온라인 저장</button><a href="index.html">문파원 화면 확인 ↗</a></p></section><div id="status" class="status warn" role="status">Firebase 연결 상태 확인 중...</div></main><footer>파티 문파 · 관리자 전용</footer><script src="config.js"></script><script src="data.js"></script><script type="module" src="app.js"></script></body></html>
