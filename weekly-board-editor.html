<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파티 · 주간 플래너 편집</title><link rel="stylesheet" href="weekly-board-editor.css"><link rel="stylesheet" href="weekly-board.css?v=29"></head><body data-weekly-editor="true"><main><header><a href="admin.html">← 문주 관리자</a><h1>⚔ 문파 주간 플래너 편집</h1><p>Firebase 연결 후 저장하면 공개 홈페이지 주간 플래너에 자동 반영돼.</p></header><section class="panel" style="border:2px solid #d4aa72"><h2>☁ Firebase 주간 플래너</h2><button id="partyWeeklyCloudLogin" type="button">Google 관리자 로그인</button><button id="partyWeeklyCloudLoad" type="button">서버 다시 읽기</button><button id="partyWeeklyCloudSave" type="button">Firebase에 플래너 저장</button><a href="party-content-migration.html">3종 최초 등록 ↗</a><p id="partyWeeklyCloudStatus" role="status">서버 연결 대기 중</p></section><section class="panel"><h2>주간 일정 편집</h2><div id="entries"></div><div class="buttons"><button id="add">+ 콘텐츠 추가</button><button id="saveFile">⬇ 플래너 JS 백업 다운로드</button><button id="backup">JSON 백업 다운로드</button><label class="upload-label">JSON 백업 불러오기<input id="restore" type="file" accept=".json,application/json"></label></div><p id="status" role="status"></p></section><section class="panel"><h2>드래그 배치 (월~일 · 기본 8줄)</h2><div id="partyWeeklyBoard" class="weekly-board-shell"></div><div id="placementControls" class="placement-controls"><strong>일정 카드를 클릭하면 위치 설정이 나타나요.</strong></div></section><section class="panel note"><h2>저장 방법</h2><p>위에서 내용을 수정하고 「Firebase에 플래너 저장」을 누르면 홈페이지에 자동 반영돼. JS 백업은 필요한 경우에만 내려받으면 돼.</p><p>실제 저장은 관리자 로그인과 Firestore 보안 규칙을 통과해야 해.</p></section></main><script src="weekly-board-data.js"></script><script src="weekly-board.js"></script><script src="weekly-board-editor.js"></script><script type="module" src="party-content-cloud-editor.js?v=2"></script></body></html>
